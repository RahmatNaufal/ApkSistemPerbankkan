<!DOCTYPE html>

<head th:replace="~{fragments/head :: head('Akses Ditolak')}"></head>
<body>
<div class="canvas">

    <main class="page page--narrow">

            <section class="card error-panel" aria-labelledby="error-title">
                <p class="error-panel__code amount">403</p>
                <h1 id="error-title">Akses ditolak</h1>
                <p class="muted">Kamu tidak memiliki izin untuk membuka halaman ini. Jika ini bukan kesengajaan, kembali ke beranda dan gunakan menu yang tersedia untuk akunmu.</p>
                <a class="btn btn--primary" th:href="@{/}" href="/">← Kembali ke Beranda</a>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
