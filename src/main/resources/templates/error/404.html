<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Halaman Tidak Ditemukan')}"></head>
<body>
<div class="canvas">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="page page--narrow">
        <div class="wrap">
            <section class="card error-panel" aria-labelledby="error-title">
                <p class="error-panel__code amount">404</p>
                <h1 id="error-title">Halaman tidak ditemukan</h1>
                <p class="muted">Alamat yang kamu buka mungkin salah atau sudah dipindahkan. Periksa kembali tautannya, atau mulai dari beranda.</p>
                <a class="btn btn--primary" th:href="@{/}" href="/">← Kembali ke Beranda</a>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
