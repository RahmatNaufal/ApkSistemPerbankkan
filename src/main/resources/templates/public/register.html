<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Daftar')}"></head>
<body>
<div class="canvas">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="page page--narrow">
        <div class="wrap">
            <div class="alert alert--success" role="status" th:if="${successMessage}">
                <span class="alert__icon" aria-hidden="true">✓</span><span th:text="${successMessage}"></span>
            </div>
            <div class="alert alert--danger" role="alert" th:if="${errorMessage}">
                <span class="alert__icon" aria-hidden="true">✕</span><span th:text="${errorMessage}"></span>
            </div>

            <section class="card auth-card" aria-labelledby="register-title">
                <p class="eyebrow">Buat akun simulasi</p>
                <h1 id="register-title">Daftar sebagai nasabah</h1>
                <p class="muted">Satu akun akan mendapat satu rekening Tabungan dengan saldo awal Rp0.</p>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="form">
                    <div class="field">
                        <label for="fullName">Nama lengkap</label>
                        <input id="fullName" type="text" th:field="*{fullName}" autocomplete="name" placeholder="Nama sesuai identitas" required>
                        <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}" autocomplete="email" inputmode="email" placeholder="nama@contoh.com" required>
                        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>
                    <div class="field">
                        <label for="phone">Nomor telepon</label>
                        <input id="phone" type="tel" th:field="*{phone}" autocomplete="tel" inputmode="tel" placeholder="08xxxxxxxxxx" required>
                        <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" type="password" th:field="*{password}" autocomplete="new-password" placeholder="Minimal 8 karakter" required>
                        <p class="hint">Gunakan minimal 8 karakter, kombinasi huruf dan angka.</p>
                        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>
                    <button type="submit" class="btn btn--accent btn--block btn--lg">Buat Akun <span aria-hidden="true">→</span></button>
                </form>

                <p class="auth-card__foot">Sudah punya akun? <a th:href="@{/login}" href="/login">Masuk</a></p>
                <p class="fineprint"><span aria-hidden="true">⚠</span> Simulasi akademik — jangan gunakan data pribadi nyata.</p>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
