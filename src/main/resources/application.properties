spring.application.name=Sistem Perbankan - INT BANK

# Profil aktif: mysql (default, XAMPP) | demo | test
spring.profiles.active=${INTBANK_PROFILE:mysql}

# MySQL XAMPP. Database dibuat otomatis jika belum ada.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/int_bank?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# XAMPP memakai MariaDB. MariaDBDialect tidak memakai klausa "FOR UPDATE OF"
# yang tidak didukung MariaDB (MySQLDialect menghasilkan klausa tersebut).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.thymeleaf.cache=false
server.port=${PORT:8080}

# Aturan bisnis yang dapat dikonfigurasi (nilai demo)
intbank.max-transaction-amount=100000000
intbank.max-daily-withdrawal=50000000
intbank.login.max-attempts=5
intbank.login.lock-minutes=15
